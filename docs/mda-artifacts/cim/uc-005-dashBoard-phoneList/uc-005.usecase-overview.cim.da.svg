<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="702px" preserveAspectRatio="none" style="width:1495px;height:702px;background:#FFFFFF;" version="1.1" viewBox="0 0 1495 702" width="1495px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="392.8203" x="547.9744" y="23.5352">UC-005 Drifttavlen &#8212; Telefonliste-koordinering (CIM)</text></g><!--cluster Slottet ? Telefonkoordinering pr. vagt--><g class="cluster" data-qualified-name="Slottet . Telefonkoordinering pr. vagt" data-source-line="27" id="ent0004"><rect fill="#F8F8F8" height="144.97" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="1223" x="7" y="159.9683"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="151.4434" x="542.7783" y="175.5034">&#171;Forretningsdom&#230;ne&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="277.9561" x="479.522" y="191.9917">Slottet &#8212; Telefonkoordinering pr. vagt</text></g><!--entity UC1--><g class="entity" data-qualified-name="Slottet . Telefonkoordinering pr. vagt.UC1" data-source-line="29" id="ent0005"><ellipse cx="722.9961" cy="249.9435" fill="#FFF9E6" rx="142.9261" ry="30.9852" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="230.4326" x="607.7798" y="247.0516">Se hvilken medarbejder der b&#230;rer</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.5596" x="612.2163" y="263.5399">hvilken arbejdstelefon p&#229; vagten</text></g><!--entity UC2--><g class="entity" data-qualified-name="Slottet . Telefonkoordinering pr. vagt.UC2" data-source-line="30" id="ent0006"><ellipse cx="427.9967" cy="249.9456" fill="#FFF9E6" rx="117.5367" ry="25.9073" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="126.6289" x="364.6822" y="243.8447">Tage ansvar for en</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="182.1777" x="336.9078" y="260.333">arbejdstelefon p&#229; min vagt</text></g><!--entity UC3--><g class="entity" data-qualified-name="Slottet . Telefonkoordinering pr. vagt.UC3" data-source-line="31" id="ent0007"><ellipse cx="152.998" cy="249.9499" fill="#FFF9E6" rx="122.208" ry="26.8416" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.4893" x="59.2534" y="248.2106">Aflevere min arbejdstelefon</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.4258" x="76.2851" y="264.6989">ved vagtens afslutning</text></g><!--entity UC4--><g class="entity" data-qualified-name="Slottet . Telefonkoordinering pr. vagt.UC4" data-source-line="32" id="ent0008"><ellipse cx="1043.9986" cy="249.946" fill="#FFF9E6" rx="142.8886" ry="30.9777" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="246.9893" x="920.504" y="249.7921">Identificere hvilken medarbejder der</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.3193" x="945.339" y="266.2804">skal kontaktes om en beboer</text></g><!--entity Plejer--><g class="entity" data-qualified-name="Plejer" data-source-line="23" id="ent0002"><ellipse cx="428.0032" cy="51.4883" fill="#E8F4FD" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M428.0032,59.4883 L428.0032,86.4883 M415.0032,67.4883 L441.0032,67.4883 M428.0032,86.4883 L415.0032,101.4883 M428.0032,86.4883 L441.0032,101.4883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.9863" x="379.01" y="116.5234">Plejepersonale</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="49.916" x="379.01" y="133.0117">p&#229; vagt</text></g><!--entity Koordinator--><g class="entity" data-qualified-name="Koordinator" data-source-line="24" id="ent0003"><ellipse cx="882.9983" cy="59.7383" fill="#E8F4FD" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M882.9983,67.7383 L882.9983,94.7383 M869.9983,75.7383 L895.9983,75.7383 M882.9983,94.7383 L869.9983,109.7383 M882.9983,94.7383 L895.9983,109.7383" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.9365" x="837.03" y="124.7734">Vagtansvarlig</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="44" id="ent0015"><path d="M963.23,340.9383 L963.23,687.7703 L1480.7691,687.7703 L1480.7691,350.9383 L1470.7691,340.9383 L963.23,340.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1470.7691,340.9383 L1470.7691,350.9383 L1480.7691,350.9383 L1470.7691,340.9383" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="139.7119" x="969.23" y="358.5066">Forretningskontekst:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.5962" x="969.23" y="373.8172">Slottet er et d&#248;gnbemandet bosted for borgere med</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.8599" x="969.23" y="389.1277">s&#230;rlige behov. Plejepersonalet arbejder i dag-, aften-</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7915" x="969.23" y="404.4383">eller nattevagter. P&#229; hver vagt b&#230;res faste arbejdstelefoner</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.8394" x="969.23" y="419.7488">af bestemte medarbejdere, s&#229; kolleger og beboere kan</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="128.1465" x="969.23" y="435.0594">n&#229; den rette person.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="969.23" y="450.3699">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="135.5859" x="969.23" y="465.6805">I dag (papirbaseret):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.0308" x="969.23" y="480.991">Tildelingen af telefoner til medarbejdere noteres p&#229; et</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.1855" x="969.23" y="496.3016">papirbaseret overlapsskema. Sv&#230;rt at holde opdateret;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.4282" x="969.23" y="511.6121">let at miste; ingen historik.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="969.23" y="526.9227">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="120.7705" x="969.23" y="542.2332">Forretningsregler:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="496.5391" x="969.23" y="557.5438">- Telefonnumre er faste: 41522, 41523, 41524, 41525, 41526, 41527, 41529</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="303.5894" x="969.23" y="572.8543">- Hver telefon b&#230;res af &#233;n medarbejder pr. vagt</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.9502" x="969.23" y="588.1648">- Vagttyper: Dag, Aften, Nat</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="359.7471" x="969.23" y="603.4754">- Telefonlisten er til identifikation &#8212; ikke en kontaktliste</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="969.23" y="618.7859">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="223.5391" x="969.23" y="634.0965">Hvad denne CIM IKKE indeholder:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="437.1694" x="969.23" y="649.407">Intet system, ingen sk&#230;rme, ingen indtastningsfelter, ingen knapper.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="343.4844" x="969.23" y="664.7176">Det er anliggender for PIM (platformuafh&#230;ngig model)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.1221" x="969.23" y="680.0281">og PSM (platformsspecifik model).</text></g><!--link Plejer to UC1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="37" id="lnk9"><path d="M477.49,107.3283 C503.5,116.8783 535.59,129.7383 563,143.9683 C606.05,166.3183 647.1547,193.845 678.7247,216.355" fill="none" id="Plejer-to-UC1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="683.61,219.8383,678.6042,211.3564,679.5389,216.9355,673.9598,217.8702,683.61,219.8383" style="stroke:#181818;stroke-width:1;"/></g><!--link Plejer to UC2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="38" id="lnk10"><path d="M428,136.3183 C428,164.8383 428,194.4183 428,217.8683" fill="none" id="Plejer-to-UC2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="428,223.8683,432,214.8683,428,218.8683,424,214.8683,428,223.8683" style="stroke:#181818;stroke-width:1;"/></g><!--link Plejer to UC3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="39" id="lnk11"><path d="M378.78,106.4083 C352.54,115.7783 320.17,128.7583 293,143.9683 C251.91,166.9683 213.8391,196.7331 186.5791,219.6931" fill="none" id="Plejer-to-UC3" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="181.99,223.5583,191.4505,220.8198,185.8143,220.3373,186.2969,214.701,181.99,223.5583" style="stroke:#181818;stroke-width:1;"/></g><!--link Koordinator to UC1--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="40" id="lnk12"><path d="M845.08,128.0383 C816.9,155.9483 783.233,189.2961 757.173,215.1061" fill="none" id="Koordinator-to-UC1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="752.91,219.3283,762.1193,215.8371,756.4625,215.8098,756.4898,210.153,752.91,219.3283" style="stroke:#181818;stroke-width:1;"/></g><!--link Koordinator to UC4--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" data-link-type="dependency" data-source-line="41" id="lnk13"><path d="M921.15,128.0383 C949.52,155.9483 983.4041,189.3092 1009.6241,215.1192" fill="none" id="Koordinator-to-UC4" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1013.9,219.3283,1010.2921,210.164,1010.3367,215.8207,1004.68,215.8653,1013.9,219.3283" style="stroke:#181818;stroke-width:1;"/></g><!--link Slottet ? Telefonkoordinering pr. vagt to GMN14--><g class="link" data-entity-1="ent0004" data-entity-2="ent0015" data-link-type="association" data-source-line="44" id="lnk16"><path d="M1222,304.9439 C1222,305.1068 1222,305.2701 1222,305.