<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="683px" preserveAspectRatio="none" style="width:1442px;height:683px;background:#FFFFFF;" version="1.1" viewBox="0 0 1442 683" width="1442px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="15"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="426.6787" x="504.1945" y="23.5352">UC-005 Operations Board &#8212; Phone List Coordination (CIM)</text></g><!--cluster Slottet ? Shift Phone Coordination--><g class="cluster" data-qualified-name="Slottet . Shift Phone Coordination" data-source-line="27" id="ent0004"><rect fill="#F8F8F8" height="140.69" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="1160" x="7" y="159.9583"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="130.4092" x="521.7954" y="175.4934">&#171;Business Domain&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="250.3525" x="461.8237" y="191.9817">Slottet &#8212; Shift Phone Coordination</text></g><!--entity UC1--><g class="entity" data-qualified-name="Slottet . Shift Phone Coordination.UC1" data-source-line="29" id="ent0005"><ellipse cx="696.9955" cy="247.8114" fill="#FFF9E6" rx="132.2155" ry="28.8431" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.1348" x="605.4281" y="242.5656">See which caregiver carries</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="212.2559" x="590.8676" y="259.0538">which work phone for this shift</text></g><!--entity UC2--><g class="entity" data-qualified-name="Slottet . Shift Phone Coordination.UC2" data-source-line="30" id="ent0006"><ellipse cx="406.0006" cy="247.8044" fill="#FFF9E6" rx="124.1806" ry="27.2361" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.5137" x="323.7437" y="242.9954">Take responsibility for a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.9385" x="311.5313" y="259.4837">work phone during my shift</text></g><!--entity UC3--><g class="entity" data-qualified-name="Slottet . Shift Phone Coordination.UC3" data-source-line="31" id="ent0007"><ellipse cx="138.9992" cy="247.8045" fill="#FFF9E6" rx="107.8692" ry="24.5162" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.7266" x="58.6359" y="246.9695">Release my work phone</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95.5596" x="91.2194" y="263.4577">at end of shift</text></g><!--entity UC4--><g class="entity" data-qualified-name="Slottet . Shift Phone Coordination.UC4" data-source-line="32" id="ent0008"><ellipse cx="994.0035" cy="247.813" fill="#FFF9E6" rx="129.7735" ry="28.3547" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="179.5664" x="904.2203" y="242.901">Identify which caregiver to</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.8545" x="892.0763" y="259.3893">contact for a resident concern</text></g><!--entity Caregiver--><g class="entity" data-qualified-name="Caregiver" data-source-line="23" id="ent0002"><ellipse cx="405.9985" cy="51.4883" fill="#E8F4FD" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M405.9985,59.4883 L405.9985,86.4883 M392.9985,67.4883 L418.9985,67.4883 M405.9985,86.4883 L392.9985,101.4883 M405.9985,86.4883 L418.9985,101.4883" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4971" x="373.75" y="116.5234">Caregiver</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.377" x="373.75" y="133.0117">on Shift</text></g><!--entity Coordinator--><g class="entity" data-qualified-name="Coordinator" data-source-line="24" id="ent0003"><ellipse cx="845.0029" cy="59.7283" fill="#E8F4FD" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M845.0029,67.7283 L845.0029,94.7283 M832.0029,75.7283 L858.0029,75.7283 M845.0029,94.7283 L832.0029,109.7283 M845.0029,94.7283 L858.0029,109.7283" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.5459" x="786.73" y="124.7634">Shift Coordinator</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="44" id="ent0015"><path d="M890.93,336.6483 L890.93,668.1698 L1427.0677,668.1698 L1427.0677,346.6483 L1417.0677,336.6483 L890.93,336.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1417.0677,336.6483 L1417.0677,346.6483 L1427.0677,346.6483 L1417.0677,336.6483" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="116.251" x="896.93" y="354.2166">Business context:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="354.4023" x="896.93" y="369.5272">Slottet is a 24-hour residential care facility for residents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="386.5215" x="896.93" y="384.8377">with special needs. Caregivers work in Day, Evening, or Night</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.6689" x="896.93" y="400.1483">shifts. During each shift, fixed work phones are carried by</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.1113" x="896.93" y="415.4588">specific caregivers so that colleagues and residents can</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.6313" x="896.93" y="430.7694">reach the right person.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="896.93" y="446.0799">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="144.7773" x="896.93" y="461.3905">Today (paper-based):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="416.9839" x="896.93" y="476.701">Phone-to-caregiver assignments are tracked on a paper handover</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.3452" x="896.93" y="492.0116">form. Hard to keep current; easy to lose; no history.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="896.93" y="507.3221">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="92.7646" x="896.93" y="522.6327">Domain rules:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="515.1377" x="896.93" y="537.9432">- Phone numbers are fixed: 41522, 41523, 41524, 41525, 41526, 41527, 41529</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.7461" x="896.93" y="553.2538">- Each phone is carried by one caregiver per shift</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.5342" x="896.93" y="568.5643">- Shifts: Day, Evening, Night</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.6123" x="896.93" y="583.8748">- The phone list is for identification &#8212; not a contact list</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="896.93" y="599.1854">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="219.5718" x="896.93" y="614.4959">What this CIM does NOT contain:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355.0117" x="896.93" y="629.8065">No system, no screens, no input fields, no save buttons.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="408.7192" x="896.93" y="645.117">Those are platform-independent and platform-specific concerns</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.0132" x="896.93" y="660.4276">handled in PIM and PSM.</text></g><!--link Caregiver to UC1--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="37" id="lnk9"><path d="M438.55,100.2183 C467.97,109.6083 512.06,125.1483 548,143.9583 C589.63,165.7483 628.6827,193.5252 657.9427,215.8852" fill="none" id="Caregiver-to-UC1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="662.71,219.5283,657.9877,210.8854,658.7372,216.4923,653.1302,217.2418,662.71,219.5283" style="stroke:#181818;stroke-width:1;"/></g><!--link Caregiver to UC2--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="38" id="lnk10"><path d="M406,136.1083 C406,163.5083 406,191.3983 406,214.4083" fill="none" id="Caregiver-to-UC2" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="406,220.4083,410,211.4083,406,215.4083,402,211.4083,406,220.4083" style="stroke:#181818;stroke-width:1;"/></g><!--link Caregiver to UC3--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="39" id="lnk11"><path d="M373.35,99.4183 C343.66,108.3183 299.23,123.5883 264,143.9583 C225.08,166.4683 190.3225,196.8779 166.4725,219.6179" fill="none" id="Caregiver-to-UC3" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="162.13,223.7583,171.404,220.4427,165.7487,220.308,165.8835,214.6527,162.13,223.7583" style="stroke:#181818;stroke-width:1;"/></g><!--link Coordinator to UC1--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="40" id="lnk12"><path d="M809.55,127.9183 C782.87,156.0983 751.0343,189.7205 727.0143,215.1005" fill="none" id="Coordinator-to-UC1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="722.89,219.4583,731.9816,215.6711,726.3269,215.8268,726.1712,210.1721,722.89,219.4583" style="stroke:#181818;stroke-width:1;"/></g><!--link Coordinator to UC4--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" data-link-type="dependency" data-source-line="41" id="lnk13"><path d="M880.69,127.9183 C907.72,156.2783 940.0804,190.225 964.2604,215.595" fill="none" id="Coordinator-to-UC4" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="968.4,219.9383,965.0862,210.6637,964.9504,216.3189,959.2951,216.1831,968.4,219.9383" style="stroke:#181818;stroke-width:1;"/></g><!--link Slottet ? Shift Phone Coordination to GMN14--><g class="link" data-entity-1="ent0004" data-entity-2="ent0015" data-link-type="association" data-source-line="44" id="lnk16"><path d="M1159,300.7227 C1159,300.8811 1159,301.0398 1159,301.1987 C1159,301.8343 1159,302.4737 1159,303.1169 C1159,313.4077 1159,324.6558 1159,336.3983" fill="none" id="Slottet &#8212; Shift Phone Coordination-GMN14" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/></g><?plantuml-src fLRRRXit47tVhnYu3xO1IKby