181818;stroke-width:1;"/><path d="M369.6643,354.2188 L361.9445,354.2188 L361.9445,341.8258 L369.6643,341.8258 L369.6643,343.984 L364.3933,343.984 L364.3933,346.6568 L369.1662,346.6568 L369.1662,348.815 L364.3933,348.815 L364.3933,352.0606 L369.6643,352.0606 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="86.3555" x="378.05" y="344.0098">&#171;enumeration&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.0127" x="391.2214" y="360.0762">Vagttype</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="352.05" x2="464.4055" y1="368.0294" y2="368.0294"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="26.9473" x="357.05" y="385.5645">Dag</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="36.5313" x="357.05" y="402.0528">Aften</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="23.3105" x="357.05" y="418.5411">Nat</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="352.05" x2="464.4055" y1="425.4942" y2="425.4942"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="60" id="ent0010"><path d="M467.58,74.1083 L467.58,113.3783 L433.28,117.3783 L467.58,121.3783 L467.58,160.661 A0,0 0 0 0 467.58,160.661 L850.8788,160.661 A0,0 0 0 0 850.8788,160.661 L850.8788,84.1083 L840.8788,74.1083 L467.58,74.1083 A0,0 0 0 0 467.58,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M840.8788,74.1083 L840.8788,84.1083 L850.8788,84.1083 L840.8788,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="152.1152" x="473.58" y="91.6766">Invarianter (Regel M5):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.2988" x="473.58" y="106.9872">- &#201;n Telefontildeling pr. (Telefon, Vagttype)-kombination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="349.7051" x="473.58" y="122.2977">- &#201;n Telefontildeling pr. (Plejer, Vagttype)-kombination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.269" x="473.58" y="137.6083">- Telefon.nummer skal tilh&#248;re det faste s&#230;t</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.3198" x="473.58" y="152.9188">- Vagttype er lukket enumeration</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="68" id="ent0013"><path d="M500.23,268.2783 L500.23,492.6259 A0,0 0 0 0 500.23,492.6259 L902.229,492.6259 A0,0 0 0 0 902.229,492.6259 L902.229,278.2783 L892.229,268.2783 L545.87,268.2783 L391.5,162.6683 L537.87,268.2783 L500.23,268.2783 A0,0 0 0 0 500.23,268.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M892.229,268.2783 L892.229,278.2783 L902.229,278.2783 L892.229,268.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="312.3174" x="506.23" y="285.8466">Hvorfor Telefontildeling eksisterer (Regel M3):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="506.23" y="301.1572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336.0576" x="506.23" y="316.4677">I CIM findes der kun en relation: "Plejer b&#230;rer telefon</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.8472" x="506.23" y="331.7783">p&#229; vagt". En relation kan ikke gemmes, auditeres eller</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="131.8345" x="506.23" y="347.0888">foresp&#248;rges over tid.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="506.23" y="362.3994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.0923" x="506.23" y="377.7099">I PIM oph&#248;jes relationen til en systementitet fordi</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="89.7813" x="506.23" y="393.0205">systemet skal:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="197.1265" x="506.23" y="408.331">- HUSKE tildelinger vedvarende</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.8081" x="506.23" y="423.6416">- AUDITERE hvem der tildelte hvad og hvorn&#229;r</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.3486" x="506.23" y="438.9521">- FORESP&#216;RGE tildelinger pr. vagt, pr. telefon, pr. plejer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.999" x="506.23" y="454.2627">- RYDDE tildelinger uden at p&#229;virke underliggende begreber</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="506.23" y="469.5732">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268.6519" x="506.23" y="484.8837">Dette er en klassisk CIM -&gt; PIM-elevation.</text></g><g class="entity" data-qualified-name="N1" data-source-line="85" id="ent0015"><path d="M885.96,43.4883 L885.96,191.2832 L1170.502,191.2832 L1170.502,53.4883 L1160.502,43.4883 L885.96,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1160.502,43.4883 L1160.502,53.4883 L1170.502,53.4883 L1160.502,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="199.5513" x="891.96" y="61.0566">Bem&#230;rk: KUN generiske typer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="891.96" y="76.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214.043" x="891.96" y="91.6777">Typer her er platformuafh&#230;ngige:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="115.4131" x="891.96" y="106.9883">- UUID (ikke Guid)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="149.6968" x="891.96" y="122.2988">- String (ikke C# string)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.6621" x="891.96" y="137.6094">- DateTime (ikke DateTimeOffset)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5913" x="891.96" y="152.9199">- Enumeration (begreb, ikke C# enum)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="891.96" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.542" x="891.96" y="183.541">Platformsspecifikke typer optr&#230;der i PSM.</text></g><g class="entity" data-qualified-name="N2" data-source-line="97" id="ent0016"><path d="M1205.75,74.1083 L1205.75,160.661 L1604.7021,160.661 L1604.7021,84.1083 L1594.7021,74.1083 L1205.75,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1594.7021,74.1083 L1594.7021,84.1083 L1604.7021,84.1083 L1594.7021,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="309.042" x="1211.75" y="91.6766">Bem&#230;rk: INGEN data uden for UC-005's scope</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1211.75" y="106.9872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.894" x="1211.75" y="122.2977">Slottet og Beboer findes i CIM, men deltager ikke i</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="377.9521" x="1211.75" y="137.6083">telefonkoordinering. De optr&#230;der i andre PIM'er (fx UC-001</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.356" x="1211.75" y="152.9188">Drifttavle for beboere). PIM er use-case-afgr&#230;nset.</text></g><!--link Tildeling to Plejer--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="dependency" data-source-line="54" id="lnk6"><path codeLine="54" d="M275.97,162.6683 C242.98,191.5283 200.15,230.6683 165.23,268.2783 C146.89,288.0283 131.7888,306.473 116.3388,326.553" fill="none" id="Tildeling-to-Plejer" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="112.68,331.3083,121.3385,326.6146,115.729,327.3455,114.9981,321.7361,112.68,331.3083" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="52.9141" x="208.9" y="234.8466">tildelt til</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="260.0738" y="182.6808">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="109.1186" y="320.9331">1</text></g><!--link Tildeling to Telefon--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="55" id="lnk7"><path codeLine="55" d="M3