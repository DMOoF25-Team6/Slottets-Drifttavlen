<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="677px" preserveAspectRatio="none" style="width:1380px;height:677px;background:#FFFFFF;" version="1.1" viewBox="0 0 1380 677" width="1380px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="22"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="430.4385" x="471.7625" y="23.5352">UC-005 Phone List Coordination &#8212; Use Case Diagram (PIM)</text></g><!--cluster Phone Coordination System--><g class="cluster" data-qualified-name="Phone Coordination System" data-source-line="35" id="ent0005"><rect fill="#F0F0F0" height="384.41" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="659" x="267.27" y="192.9214"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="62.7676" x="565.3862" y="208.4566">&#171;System&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="198.7139" x="497.4131" y="224.9448">Phone Coordination System</text></g><!--entity UC_View--><g class="entity" data-qualified-name="Phone Coordination System.UC_View" data-source-line="37" id="ent0006"><ellipse cx="366.2651" cy="527.3305" fill="#E6F4FF" rx="75.3251" ry="25.9991" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.7012" x="314.4145" y="524.2846">View phone list</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.8223" x="317.3539" y="540.7729">for active shift</text></g><!--entity UC_Assign--><g class="entity" data-qualified-name="Phone Coordination System.UC_Assign" data-source-line="38" id="ent0007"><ellipse cx="597.274" cy="276.9467" fill="#E6F4FF" rx="100.794" ry="24.0053" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.5283" x="520.5098" y="276.9212">Assign caregiver name</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.8535" x="566.8472" y="293.4095">to phone</text></g><!--entity UC_Clear--><g class="entity" data-qualified-name="Phone Coordination System.UC_Clear" data-source-line="39" id="ent0008"><ellipse cx="808.2652" cy="276.9504" fill="#E6F4FF" rx="74.8452" ry="17.369" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.6875" x="749.4215" y="281.6946">Clear assignment</text></g><!--entity UC_Refresh--><g class="entity" data-qualified-name="Phone Coordination System.UC_Refresh" data-source-line="40" id="ent0009"><ellipse cx="376.2668" cy="276.9465" fill="#E6F4FF" rx="85.1968" ry="25.0251" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="123.0674" x="314.7331" y="275.332">Refresh phone list</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90.6514" x="330.9411" y="291.8203">automatically</text></g><!--entity UC_Validate--><g class="entity" data-qualified-name="Phone Coordination System.UC_Validate" data-source-line="41" id="ent0010"><ellipse cx="702.2724" cy="527.3282" fill="#E6F4FF" rx="107.4824" ry="25.8168" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.252" x="633.6464" y="523.1115">Validate assignment</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.0059" x="626.7695" y="539.5998">against business rules</text></g><!--entity Caregiver--><g class="entity" data-qualified-name="Caregiver" data-source-line="30" id="ent0002"><ellipse cx="597.2785" cy="61.6914" fill="#FFF4E6" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M597.2785,69.6914 L597.2785,96.6914 M584.2785,77.6914 L610.2785,77.6914 M597.2785,96.6914 L584.2785,111.6914 M597.2785,96.6914 L610.2785,111.6914" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4971" x="565.03" y="126.7266">Caregiver</text></g><!--entity Coordinator--><g class="entity" data-qualified-name="Coordinator" data-source-line="31" id="ent0003"><ellipse cx="185.2729" cy="247.2014" fill="#FFF4E6" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M185.2729,255.2014 L185.2729,282.2014 M172.2729,263.2014 L198.2729,263.2014 M185.2729,282.2014 L172.2729,297.2014 M185.2729,282.2014 L198.2729,297.2014" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.5459" x="127" y="312.2366">Shift Coordinator</text></g><!--entity TimeEvent--><g class="entity" data-qualified-name="TimeEvent" data-source-line="32" id="ent0004"><ellipse cx="376.2726" cy="69.9297" fill="#FFF4E6" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M376.2726,77.9297 L376.2726,104.9297 M363.2726,85.9297 L389.2726,85.9297 M376.2726,104.9297 L363.2726,119.9297 M376.2726,104.9297 L389.2726,119.9297" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.2852" x="312.63" y="134.9648">System Time Event</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="62.3643" x="345.0904" y="58.4766">&#171;system&#187;</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="58" id="ent0020"><path d="M950.59,392.1914 L950.59,662.4707 L1365.9635,662.4707 L1365.9635,402.1914 L1355.9635,392.1914 L950.59,392.1914" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1355.9635,392.1914 L1355.9635,402.1914 L1365.9635,402.1914 L1355.9635,392.1914" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="173.9575" x="956.59" y="409.7598">Transformation from CIM:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.356" x="956.59" y="425.0703">Rule M1: "Caregiver on Shift" -&gt; "Caregiver" (system role)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="326.4854" x="956.59" y="440.3809">Rule M1: New actor "System Time Event" introduced</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="350.3906" x="956.59" y="455.6914">Rule M2: Business goals mapped to system interactions</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="394.3735" x="956.59" y="471.002">Rule M4: Implicit validation made explicit as separate use case</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="956.59" y="486.3125">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="229.6138" x="956.59" y="501.623">Still NOT included (PSM concerns):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.5176" x="956.59" y="516.9336">- No UI elements (no "click", "form", "screen")</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.4897" x="956.59" y="532.2441">- No technology (no .NET, no REST, no database)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.272" x="956.59" y="547.5547">- No persistence strategy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.3379" x="956.59" y="562.8652">- No specific data types</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="956.59" y="578.1758">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="198.3262" x="956.59" y="593.4863">Note on "System Time Event":</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.9619" x="956.59" y="608.7969">This actor exists ONLY at PIM/PSM level. It represents</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="353.1519" x="956.59" y="624.1074">the system's internal capability to react to time passing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.4473" x="956.59" y="639.418">In CIM there is no such actor &#8212; automatic refresh is a</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.3755" x="956.59" y="654.7285">system concern, not a business concern.</text></g><!--link Caregiver to UC_View--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="46" id="lnk11"><path d="M564.7,105.1014 C536.65,115.5014 494.87,129.8014 457.27,137.9214 C381.21,154.3614 161.14,118.9114 109.27,176.9214 C6,292.4214 229.6036,444.8603 323.3836,501.4803" fill="none" id="Caregiver-to-UC_View" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="328.52,504.5814,322.8828,496.5054,324.2396,501.9971,318.7479,503.354,328.52,504.5814" style="stroke:#181818;stroke-width:1;"/></g><!--link Caregiver to UC_Assign--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="47" id="lnk12"><path d="M597.27,130.0114 C597.27,166.8214 597.27,215.7514 597.27,246.6514" fill="none" id="Caregiver-to-UC_Assign" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="597.27,252.6514,601.27,243.6514,597.27,247.6514,593.27,243.6514,597.27,252.6514" style="stroke:#181818;stroke-width:1;"/></g><!--link Caregiver to UC_Clear--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" data-link-type="dependency" data-source-line="48" id="lnk13"><path d="M629.85,113.2414 C654.29,129.4414 688.07,153.1114 715.27,176.9214 C745.8,203.6414 773.4022,234.5914 790.7822,255.0214" fill="none" id="Caregiver-to-UC_Clear" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="794.67,259.5914,791.885,250.1445,791.4302,255.783,785.7917,255.3282,794.67,259.5914" style="stroke:#181818;stroke-width:1;"/></g><!--link Coordinator to UC_View--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" data-link-type="dependency" data-source-line="49" id="lnk14"><path d="M212.76,315.6714 C250.34,367.2414 313.1665,453.4523 344.8865,496.9823" fill="none" id="Coordinator-to-UC_View" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="348.42,501.8314,346.3525,492.202,345.4754,497.7905,339.8869,496.9134,348.42,501.8314" style="stroke:#181818;stroke-width:1;"/></g><!--link TimeEvent to UC_Refresh--><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" data-link-type="dependency" data-source-line="50" id="lnk15"><path d="M376.27,138.2714 C376.27,174.1514 376.27,216.6614 376.27,245.4814" fill="none" id="TimeEvent-to-UC_Refresh" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="376.27,251.4814,380.27,242.4814,376.27,246.4814,372.27,242.4814,376.27,251.4814" style="stroke:#181818;stroke-width:1;"/></g><!--link UC_Assign to UC_Validate--><g class="link" data-entity-1="ent0007" data-entity-2="ent0010" data-link-type="dependency" data-source-line="53" id="lnk16"><path d="M607.15,301.3114 C626.96,348.1714 669.0338,447.7049 689.3838,495.8449" fill="none" id="UC_Assign-to-UC_Validate" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="691.72,501.3714,691.9,491.5242,689.7732,496.766,684.5314,494.6391,691.72,501.3714" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.3569" x="632.24" y="358.7598">&#171;include&#187;</text></g><!--link UC_Clear to UC_Validate--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" data-link-type="dependency" data-source-line="54" id="lnk17"><path d="M801.15,294.6314 C782.91,337.3814 736.7751,445.4929 715.2151,496.0129" fill="none" id="UC_Clear-to-UC_Validate" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="712.86,501.5314,720.0716,494.8237,714.8226,496.9327,712.7136,491.6836,712.86,501.5314" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.3569" x="777.95" y="358.7598">&#171;include&#187;</text></g><!--link UC_Refresh to UC_View--><g class="link" data-entity-1="ent0009" data-entity-2="ent0006" data-link-type="dependency" data-source-line="55" id="lnk18"><path d="M375.3,302.2114 C373.4,349.3314 369.482,446.7963 367.542,494.8563" fill="none" id="UC_Refresh-to-UC_View" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="367.3,500.8514,371.6597,492.0201,367.5017,495.8555,363.6663,491.6974,367.3,500.8514" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.3569" x="374.32" y="358.7598">&#171;include&#187;</text></g><!--link Phone Coordination System to GMN19--><g class="link" data-entity-1="ent0005" data-entity-2="ent0020" data-link-type="association" data-source-line="58" id="lnk21"><path d="M926.5093,286.471 C926