<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="507px" preserveAspectRatio="none" style="width:1625px;height:507px;background:#FFFFFF;" version="1.1" viewBox="0 0 1625 507" width="1625px" zoomAndPan="magnify"><?plantuml 1.2026.3?><defs/><g><g class="title" data-source-line="23"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="403.0605" x="607.8834" y="23.5352">UC-005 Domain Model &#8212; Phone List Coordination (PIM)</text></g><!--class Caregiver--><g class="entity" data-qualified-name="Caregiver" data-source-line="32" id="ent0002"><rect fill="#E6F4FF" height="97.4648" rx="2.5" ry="2.5" style="stroke:#4682B4;stroke-width:0.5;" width="142.6279" x="7" y="331.7183"/><ellipse cx="42.7589" cy="347.7183" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M45.232,353.8613 Q44.651,354.1602 44.0118,354.3096 Q43.3727,354.459 42.6671,354.459 Q40.1603,354.459 38.8404,352.8071 Q37.5206,351.1553 37.5206,348.0342 Q37.5206,344.9048 38.8404,343.2529 Q40.1603,341.6011 42.6671,341.6011 Q43.3727,341.6011 44.0201,341.7505 Q44.6676,341.8999 45.232,342.1988 L45.232,344.9214 Q44.6012,344.3404 44.0077,344.0706 Q43.4142,343.8008 42.7833,343.8008 Q41.4386,343.8008 40.7538,344.8675 Q40.0689,345.9341 40.0689,348.0342 Q40.0689,350.126 40.7538,351.1926 Q41.4386,352.2593 42.7833,352.2593 Q43.4142,352.2593 44.0077,351.9895 Q44.6012,351.7197 45.232,351.1387 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.4971" x="61.372" y="353.0093">Caregiver</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="8" x2="148.6279" y1="363.7183" y2="363.7183"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.1963" x="13" y="381.2534">+id : UUID</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130.6279" x="13" y="397.7417">+firstName : String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.4834" x="13" y="414.23">+lastName : String</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="8" x2="148.6279" y1="421.1831" y2="421.1831"/></g><!--class Phone--><g class="entity" data-qualified-name="Phone" data-source-line="38" id="ent0003"><rect fill="#E6F4FF" height="64.4883" rx="2.5" ry="2.5" style="stroke:#4682B4;stroke-width:0.5;" width="129.1748" x="184.73" y="348.2083"/><ellipse cx="224.7771" cy="364.2083" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M227.2502,370.3513 Q226.6692,370.6502 226.03,370.7996 Q225.3908,370.949 224.6853,370.949 Q222.1784,370.949 220.8586,369.2971 Q219.5388,367.6453 219.5388,364.5242 Q219.5388,361.3948 220.8586,359.7429 Q222.1784,358.0911 224.6853,358.0911 Q225.3908,358.0911 226.0383,358.2405 Q226.6858,358.3899 227.2502,358.6888 L227.2502,361.4114 Q226.6194,360.8304 226.0258,360.5606 Q225.4323,360.2908 224.8015,360.2908 Q223.4568,360.2908 222.7719,361.3575 Q222.0871,362.4241 222.0871,364.5242 Q222.0871,366.616 222.7719,367.6826 Q223.4568,368.7493 224.8015,368.7493 Q225.4323,368.7493 226.0258,368.4795 Q226.6194,368.2097 227.2502,367.6287 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="41.5146" x="244.3431" y="369.4993">Phone</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="185.73" x2="312.9048" y1="380.2083" y2="380.2083"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.1748" x="190.73" y="397.7434">+number : String</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="185.73" x2="312.9048" y1="404.6966" y2="404.6966"/></g><!--class Assignment--><g class="entity" data-qualified-name="Assignment" data-source-line="42" id="ent0004"><rect fill="#E6F4FF" height="89.5977" rx="2.5" ry="2.5" style="stroke:#4682B4;stroke-width:0.5;" width="176.418" x="239.1" y="72.5883"/><ellipse cx="264.3199" cy="92.8988" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M266.7931,99.0419 Q266.212,99.3407 265.5729,99.4901 Q264.9337,99.6396 264.2281,99.6396 Q261.7213,99.6396 260.4015,97.9877 Q259.0816,96.3358 259.0816,93.2147 Q259.0816,90.0854 260.4015,88.4335 Q261.7213,86.7816 264.2281,86.7816 Q264.9337,86.7816 265.5812,86.9311 Q266.2286,87.0805 266.7931,87.3793 L266.7931,90.102 Q266.1622,89.5209 265.5687,89.2511 Q264.9752,88.9813 264.3443,88.9813 Q262.9996,88.9813 262.3148,90.048 Q261.63,91.1146 261.63,93.2147 Q261.63,95.3065 262.3148,96.3732 Q262.9996,97.4398 264.3443,97.4398 Q264.9752,97.4398 265.5687,97.1701 Q266.1622,96.9003 266.7931,96.3192 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="90.0996" x="296.3947" y="89.1898">&#171;system entity&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.707" x="280.591" y="105.2562">PhoneAssignment</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="240.1" x2="414.518" y1="113.2094" y2="113.2094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.1963" x="245.1" y="130.7445">+id : UUID</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.418" x="245.1" y="147.2328">+assignedAt : DateTime</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="240.1" x2="414.518" y1="154.1859" y2="154.1859"/></g><!--class ShiftType--><g class="entity" data-qualified-name="ShiftType" data-source-line="47" id="ent0005"><rect fill="#E6F4FF" height="106.0859" rx="2.5" ry="2.5" style="stroke:#4682B4;stroke-width:0.5;" width="114.3555" x="349.14" y="327.4083"/><ellipse cx="364.14" cy="347.7188" fill="#EB937F" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M367.7543,354.2188 L360.0345,354.2188 L360.0345,341.8258 L367.7543,341.8258 L367.7543,343.984 L362.4833,343.984 L362.4833,346.6568 L367.2562,346.6568 L367.2562,348.815 L362.4833,348.815 L362.4833,352.0606 L367.7543,352.0606 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="86.3555" x="376.14" y="344.0098">&#171;enumeration&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="63.4375" x="387.599" y="360.0762">ShiftType</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="350.14" x2="462.4955" y1="368.0294" y2="368.0294"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="25.5322" x="355.14" y="385.5645">Day</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.7871" x="355.14" y="402.0528">Evening</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.0439" x="355.14" y="418.5411">Night</text><line style="stroke:#4682B4;stroke-width:0.5;" x1="350.14" x2="462.4955" y1="425.4942" y2="425.4942"/></g><g class="entity" data-qualified-name="GMN9" data-source-line="60" id="ent0010"><path d="M450.13,74.1083 L450.13,113.3783 L415.71,117.3783 L450.13,121.3783 L450.13,160.661 A0,0 0 0 0 450.13,160.661 L872.505,160.661 A0,0 0 0 0 872.505,160.661 L872.505,84.1083 L862.505,74.1083 L450.13,74.1083 A0,0 0 0 0 450.13,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M862.505,74.1083 L862.505,84.1083 L872.505,84.1083 L862.505,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="138.2837" x="456.13" y="91.6766">Invariants (Rule M5):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380.0342" x="456.13" y="106.9872">- One PhoneAssignment per (Phone, ShiftType) combination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="401.375" x="456.13" y="122.2977">- One PhoneAssignment per (Caregiver, ShiftType) combination</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.7173" x="456.13" y="137.6083">- Phone.number must belong to the fixed set</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.6494" x="456.13" y="152.9188">- ShiftType is closed enumeration</text></g><g class="entity" data-qualified-name="GMN12" data-source-line="68" id="ent0013"><path d="M498.63,268.2783 L498.63,492.6259 A0,0 0 0 0 498.63,492.6259 L897.9947,492.6259 A0,0 0 0 0 897.9947,492.6259 L897.9947,278.2783 L887.9947,268.2783 L543.81,268.2783 L390.25,162.6683 L535.81,268.2783 L498.63,268.2783 A0,0 0 0 0 498.63,268.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M887.9947,268.2783 L887.9947,278.2783 L897.9947,278.2783 L887.9947,268.2783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="267.687" x="504.63" y="285.8466">Why PhoneAssignment exists (Rule M3):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="504.63" y="301.1572">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.4419" x="504.63" y="316.4677">In CIM, there is only a relationship: "Caregiver carries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.8892" x="504.63" y="331.7783">Phone on Shift". A relationship cannot be stored, audited,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.0278" x="504.63" y="347.0888">or queried over time.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="504.63" y="362.3994">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="332.7759" x="504.63" y="377.7099">In PIM, the relationship is elevated to a system entity</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.8076" x="504.63" y="393.0205">because the system must:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.9541" x="504.63" y="408.331">- REMEMBER assignments persistently</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.6904" x="504.63" y="423.6416">- AUDIT who assigned what and when</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.5454" x="504.63" y="438.9521">- QUERY assignments by shift, by phone, by caregiver</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.3647" x="504.63" y="454.2627">- CLEAR assignments without affecting underlying concepts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="504.63" y="469.5732">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.1543" x="504.63" y="484.8837">This is a classic CIM -&gt; PIM elevation.</text></g><g class="entity" data-qualified-name="N1" data-source-line="85" id="ent0015"><path d="M907.97,43.4883 L907.97,191.2832 L1172.6629,191.2832 L1172.6629,53.4883 L1162.6629,43.4883 L907.97,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1162.6629,43.4883 L1162.6629,53.4883 L1172.6629,53.4883 L1162.6629,43.4883" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="181.3081" x="913.97" y="61.0566">Notice: GENERIC types only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="913.97" y="76.3672">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.9536" x="913.97" y="91.6777">Types here are platform-independent:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.1318" x="913.97" y="106.9883">- UUID (not Guid)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.4155" x="913.97" y="122.2988">- String (not C# string)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.3809" x="913.97" y="137.6094">- DateTime (not DateTimeOffset)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.6929" x="913.97" y="152.9199">- Enumeration (concept, not C# enum)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="913.97" y="168.2305">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.1597" x="913.97" y="183.541">Platform-specific types appear in PSM.</text></g><g class="entity" data-qualified-name="N2" data-source-line="97" id="ent0016"><path d="M1207.8,74.1083 L1207.8,160.661 L1610.8273,160.661 L1610.8273,84.1083 L1600.8273,74.1083 L1207.8,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1600.8273,74.1083 L1600.8273,84.1083 L1610.8273,84.1083 L1600.8273,74.1083" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="264.1831" x="1213.8" y="91.6766">Notice: NO data not relevant to UC-005</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="1213.8" y="106.9872">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.7686" x="1213.8" y="122.2977">Slottet and Resident exist in CIM but do not participate in</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.0273" x="1213.8" y="137.6083">phone coordination. They appear in other PIMs (e.g. UC-001</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.4302" x="1213.8" y="152.9188">Dashboard for residents). PIM is per-use-case scoped.</text></g><!--link Assignment to Caregiver--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" data-link-type="dependency" data-source-line="54" id="lnk6"><path codeLine="54" d="M275.57,162.4683 C255.16,180.3083 231.76,201.3783 211.31,221.2783 C190.81,241.2383 186.05,246.6483 167.31,268.2783 C149.75,288.5583 134.8103,306.9109 119.1303,326.7509" fill="none" id="Assignment-to-Caregiver" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="115.41,331.4583,124.1287,326.8775,118.5103,327.5355,117.8523,321.917,115.41,331.4583" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="72.7505" x="212.31" y="234.8466">assigned to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="259.3995" y="182.7823">1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="8.2202" x="112.0796" y="321.1042">1</text></g><!--link Assignment to Phone--><g class="link" data-entity-1="ent0004" data-entity-2="ent0003" data-link-type="dependency" data-source-line="55" id="lnk7"><path codeLine="55" d="M314.08,162.6683 C298.39,215.1883 274