data-source-line="30" id="ent0002"><ellipse cx="554.766" cy="61.6814" fill="#FFF4E6" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M554.766,69.6814 L554.766,96.6814 M541.766,77.6814 L567.766,77.6814 M554.766,96.6814 L541.766,111.6814 M554.766,96.6814 L567.766,111.6814" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="37.3721" x="536.08" y="126.7166">Plejer</text></g><!--entity Koordinator--><g class="entity" data-qualified-name="Koordinator" data-source-line="31" id="ent0003"><ellipse cx="167.7583" cy="246.6314" fill="#FFF4E6" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M167.7583,254.6314 L167.7583,281.6314 M154.7583,262.6314 L180.7583,262.6314 M167.7583,281.6314 L154.7583,296.6314 M167.7583,281.6314 L180.7583,296.6314" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="91.9365" x="121.79" y="311.6666">Vagtansvarlig</text></g><!--entity Tidshaendelse--><g class="entity" data-qualified-name="Tidshaendelse" data-source-line="32" id="ent0004"><ellipse cx="352.7672" cy="69.9297" fill="#FFF4E6" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M352.7672,77.9297 L352.7672,104.9297 M339.7672,85.9297 L365.7672,85.9297 M352.7672,104.9297 L339.7672,119.9297 M352.7672,104.9297 L365.7672,119.9297" fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="93.7344" x="305.9" y="134.9648">Tidsh&#230;ndelse</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="62.3643" x="321.5851" y="58.4766">&#171;system&#187;</text></g><g class="entity" data-qualified-name="GMN19" data-source-line="58" id="ent0020"><path d="M858.27,391.6214 L858.27,661.9007 L1299.2563,661.9007 L1299.2563,401.6214 L1289.2563,391.6214 L858.27,391.6214" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1289.2563,391.6214 L1289.2563,401.6214 L1299.2563,401.6214 L1289.2563,391.6214" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="160.6909" x="864.27" y="409.1898">Transformation fra CIM:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.6211" x="864.27" y="424.5003">Regel M1: "Plejer p&#229; vagt" -&gt; "Plejer" (systemrolle)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.3262" x="864.27" y="439.8109">Regel M1: Ny akt&#248;r "Tidsh&#230;ndelse" introduceret</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.0986" x="864.27" y="455.1214">Regel M2: Forretningsm&#229;l mapped til systeminteraktioner</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.9863" x="864.27" y="470.432">Regel M4: Implicit validering gjort eksplicit som separat brugscase</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="864.27" y="485.7425">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="282.4009" x="864.27" y="501.053">Stadig IKKE inkluderet (PSM-anliggender):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.4331" x="864.27" y="516.3636">- Ingen UI-elementer (intet "klik", "formular", "sk&#230;rm")</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.5342" x="864.27" y="531.6741">- Ingen teknologi (ingen .NET, ingen REST, ingen database)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.0122" x="864.27" y="546.9847">- Ingen persistens-strategi</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.3374" x="864.27" y="562.2952">- Ingen specifikke datatyper</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="864.27" y="577.6058">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="221.4761" x="864.27" y="592.9163">Bem&#230;rkning om "Tidsh&#230;ndelse":</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.3203" x="864.27" y="608.2269">Denne akt&#248;r findes KUN p&#229; PIM/PSM-niveau. Den repr&#230;senterer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.5781" x="864.27" y="623.5374">systemets interne evne til at reagere p&#229; tid der g&#229;r.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="383.8618" x="864.27" y="638.848">I CIM findes en s&#229;dan akt&#248;r ikke &#8212; automatisk opdatering er</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.9292" x="864.27" y="654.1585">et systemanliggende, ikke et forretningsanliggende.</text></g><!--link Plejer to UC_View--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" data-link-type="dependency" data-source-line="46" id="lnk11"><path d="M535.89,99.9514 C509.62,110.1214 460.32,128.1114 416.76,137.9214 C348.6,153.2614 151,124.5314 104.76,176.9214 C6,288.8014 209.4821,443.1517 294.6921,500.4917" fill="none" id="Plejer-to-UC_View" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="299.67,503.8414,294.4363,495.4982,295.5218,501.05,289.97,502.1354,299.67,503.8414" style="stroke:#181818;stroke-width:1;"/></g><!--link Plejer to U