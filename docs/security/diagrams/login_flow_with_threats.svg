<svg width="100%" viewBox="0 0 960 760" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Sikkerhedslag i login-flow med trusler</title>
<desc>Sekvensdiagram der viser hvordan en login-request passerer gennem fem sikkerhedslag, og hvilke angreb hvert lag blokerer.</desc>

<style>
.t { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-family: Arial, sans-serif; font-size: 12px; fill: #444441; }
.tsm { font-family: Arial, sans-serif; font-size: 11px; fill: #5F5E5A; }
.th { font-family: Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.threat-title { font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #501313; }
.threat-text { font-family: Arial, sans-serif; font-size: 10.5px; fill: #791F1F; }
.code { font-family: Consolas, monospace; font-size: 10.5px; fill: #791F1F; }
</style>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Section headers -->
<text x="335" y="22" class="ts" text-anchor="middle" font-weight="700" fill="#2C2C2A">Login-flow gennem lagene</text>
<text x="800" y="22" class="ts" text-anchor="middle" font-weight="700" fill="#501313">Trusler dette lag blokerer</text>
<line x1="680" y1="30" x2="680" y2="740" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- Actor boxes (lifeline headers) -->
<rect x="30" y="40" width="110" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="85" y="58" class="th" text-anchor="middle">Bruger</text>
<text x="85" y="73" class="ts" text-anchor="middle">Blazor klient</text>

<rect x="160" y="40" width="110" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="215" y="58" class="th" text-anchor="middle" fill="#042C53">AccountCtrl</text>
<text x="215" y="73" class="ts" text-anchor="middle" fill="#185FA5">WebApi</text>

<rect x="290" y="40" width="110" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="345" y="58" class="th" text-anchor="middle" fill="#26215C">Identity</text>
<text x="345" y="73" class="ts" text-anchor="middle" fill="#534AB7">UserManager</text>

<rect x="420" y="40" width="110" height="40" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="475" y="58" class="th" text-anchor="middle" fill="#04342C">EF Core</text>
<text x="475" y="73" class="ts" text-anchor="middle" fill="#1D9E75">AppDbContext</text>

<rect x="550" y="40" width="110" height="40" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="605" y="58" class="th" text-anchor="middle" fill="#412402">MySQL</text>
<text x="605" y="73" class="ts" text-anchor="middle" fill="#BA7517">Database</text>

<!-- Lifelines -->
<line x1="85" y1="80" x2="85" y2="730" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="215" y1="80" x2="215" y2="730" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="345" y1="80" x2="345" y2="730" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="475" y1="80" x2="475" y2="730" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="605" y1="80" x2="605" y2="730" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- LAYER 1: HTTPS / TLS -->
<rect x="40" y="100" width="20" height="20" rx="3" fill="#185FA5"/>
<text x="70" y="115" class="th" fill="#0C447C">1. HTTPS / TLS</text>
<line x1="85" y1="140" x2="213" y2="140" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="149" y="134" class="ts" text-anchor="middle" fill="#185FA5">POST /Account/login (krypteret)</text>
<text x="149" y="154" class="tsm" text-anchor="middle">LoginRequestDto: email, password</text>

<rect x="695" y="100" width="240" height="62" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="705" y="118" class="threat-title">Man-in-the-middle</text>
<text x="705" y="134" class="threat-text">Aflytning af password på netværket</text>
<text x="705" y="148" class="threat-text">(fx på offentligt WiFi, ARP spoofing).</text>

<!-- LAYER 2: DTO-validering -->
<rect x="40" y="180" width="20" height="20" rx="3" fill="#534AB7"/>
<text x="70" y="195" class="th" fill="#3C3489">2. DTO-validering</text>
<rect x="195" y="212" width="270" height="40" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="330" y="228" class="ts" text-anchor="middle" fill="#3C3489">ModelState.IsValid?</text>
<text x="330" y="242" class="ts" text-anchor="middle" fill="#3C3489">[Required] [EmailAddress] [MinLength]</text>

<rect x="695" y="180" width="240" height="78" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="705" y="198" class="threat-title">Mass assignment / over-posting</text>
<text x="705" y="214" class="threat-text">Angriber tilføjer ekstra felter, fx:</text>
<text x="705" y="228" class="code">{ email, password, isAdmin: true }</text>
<text x="705" y="244" class="threat-text">DTO eksponerer ikke IsAdmin →</text>
<text x="705" y="258" class="threat-text">feltet ignoreres.</text>

<!-- LAYER 3: Identity (hash-tjek) -->
<rect x="40" y="274" width="20" height="20" rx="3" fill="#7F77DD"/>
<text x="70" y="289" class="th" fill="#3C3489">3. Identity (hash-tjek)</text>
<line x1="215" y1="312" x2="343" y2="312" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="279" y="306" class="ts" text-anchor="middle" fill="#3C3489">CheckPasswordAsync(user, pwd)</text>

<rect x="695" y="274" width="240" height="92" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="705" y="292" class="threat-title">Brute force / credential stuffing</text>
<text x="705" y="308" class="threat-text">Automatiseret afprøvning af</text>
<text x="705" y="322" class="threat-text">passwords (også fra andre breaches).</text>
<text x="705" y="338" class="threat-text">PBKDF2 = langsom hash,</text>
<text x="705" y="352" class="threat-text">salt = ingen rainbow tables,</text>
<text x="705" y="366" class="threat-text">lockout efter 5 forsøg.</text>

<!-- LAYER 4: EF Core (parametriseret SQL) -->
<rect x="40" y="384" width="20" height="20" rx="3" fill="#1D9E75"/>
<text x="70" y="399" class="th" fill="#0F6E56">4. EF Core (parametriseret SQL)</text>
<line x1="345" y1="422" x2="473" y2="422" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="409" y="416" class="ts" text-anchor="middle" fill="#0F6E56">FindByEmailAsync(email)</text>
<line x1="475" y1="452" x2="603" y2="452" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="539" y="446" class="ts" text-anchor="middle" fill="#0F6E56">SELECT * WHERE Email = @p0</text>
<line x1="603" y1="482" x2="477" y2="482" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="539" y="476" class="tsm" text-anchor="middle">User (med PasswordHash)</text>
<line x1="473" y1="510" x2="347" y2="510" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="409" y="504" class="tsm" text-anchor="middle">User entity</text>

<rect x="695" y="384" width="240" height="120" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="705" y="402" class="threat-title">SQL injection</text>
<text x="705" y="418" class="threat-text">Angriber indtaster fx i email:</text>
<text x="705" y="432" class="code">' OR 1=1 --</text>
<text x="705" y="448" class="threat-text">EF Core sender strengen som</text>
<text x="705" y="462" class="threat-text">parameter (@p0), ikke som SQL —</text>
<text x="705" y="476" class="threat-text">så det matches bare som en</text>
<text x="705" y="490" class="threat-text">almindelig (ugyldig) email.</text>

<!-- Identity password verify (continuation) -->
<rect x="195" y="528" width="270" height="36" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="330" y="546" class="ts" text-anchor="middle" fill="#3C3489">Verify(password, PasswordHash)</text>
<text x="330" y="558" class="ts" text-anchor="middle" fill="#3C3489">PBKDF2 + salt — match?</text>
<line x1="343" y1="584" x2="217" y2="584" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="279" y="578" class="ts" text-anchor="middle" fill="#3C3489">Success / Failed</text>

<rect x="695" y="524" width="240" height="62" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="705" y="542" class="threat-title">Databrud (password reveal)</text>
<text x="705" y="558" class="threat-text">Selv hvis databasen lækker, kan</text>
<text x="705" y="572" class="threat-text">hashede+saltede passwords ikke</text>
<text x="705" y="582" class="threat-text">vendes om til klartekst.</text>

<!-- LAYER 5: JWT + Authorization -->
<rect x="40" y="604" width="20" height="20" rx="3" fill="#BA7517"/>
<text x="70" y="619" class="th" fill="#854F0B">5. JWT + Authorization</text>
<rect x="155" y="634" width="170" height="40" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="240" y="650" class="ts" text-anchor="middle" fill="#854F0B">GenerateJwtToken(user)</text>
<text x="240" y="664" class="ts" text-anchor="middle" fill="#854F0B">claims: id, role, exp</text>
<line x1="213" y1="700" x2="87" y2="700" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="694" class="ts" text-anchor="middle" fill="#854F0B">200 OK + JWT + RefreshToken</text>
<text x="150" y="720" class="tsm" text-anchor="middle">[Authorize(Roles="admin")] på senere kald</text>

<rect x="695" y="604" width="240" height="120" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="705" y="622" class="threat-title">Token tampering / priv. escalation</text>
<text x="705" y="638" class="threat-text">Angriber ændrer rolle-claim i JWT</text>
<text x="705" y="652" class="threat-text">("caretaker" → "admin"). Serveren</text>
<text x="705" y="666" class="threat-text">opdager det, fordi signaturen ikke</text>
<text x="705" y="680" class="threat-text">længere matcher.</text>
<text x="705" y="698" class="threat-title">Session hijacking</text>
<text x="705" y="714" class="threat-text">JWT udløber automatisk via exp.</text>

</svg>
